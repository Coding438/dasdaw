<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Studio — Client Portal</title>
<style>
:root{
  --bg:#08090d;--surface:#0f1116;--surface-2:#151821;--surface-3:#1c2029;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.15);
  --text:#e9ecf3;--muted:#8d94a8;--accent:#7c5cff;--accent-2:#22d3ee;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--radius:16px;
  --shadow:0 14px 40px rgba(0,0,0,.42);
}
html[data-theme="light"]{
  --bg:#f5f6fb;--surface:#ffffff;--surface-2:#f2f4fa;--surface-3:#e7ebf5;
  --border:rgba(15,18,30,.09);--border-strong:rgba(15,18,30,.17);
  --text:#12151f;--muted:#5d6780;--shadow:0 14px 34px rgba(20,25,45,.10);
}
*{box-sizing:border-box}html,body{height:100%}
body{
  margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  font-size:14px;line-height:1.55;color:var(--text);
  background:radial-gradient(900px 520px at 12% -12%,rgba(124,92,255,.18),transparent 70%),
             radial-gradient(720px 420px at 92% -18%,rgba(34,211,238,.12),transparent 70%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
::selection{background:rgba(124,92,255,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.icon{width:18px;height:18px;flex:none}.muted{color:var(--muted)}.up{color:var(--good)}.down{color:var(--bad)}

.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;
  padding:20px 14px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  border-right:1px solid var(--border);backdrop-filter:blur(14px);z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 6px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 22px rgba(124,92,255,.35);
}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-weight:700;letter-spacing:-.01em;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:11px;
  color:var(--muted);font-weight:500;font-size:13.5px;transition:.16s;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.is-active{
  color:var(--text);background:linear-gradient(90deg,rgba(124,92,255,.20),rgba(34,211,238,.07));
  box-shadow:inset 0 0 0 1px rgba(124,92,255,.28);
}
.nav-item.is-active .icon{color:var(--accent-2)}
.nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:99px;padding:1px 7px}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}
.user-chip .name{font-size:12.8px;font-weight:600}.user-chip .role{font-size:11px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:13px 26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
}
.menu-btn{display:none;padding:7px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2)}
.search{
  display:flex;align-items:center;gap:9px;flex:1;max-width:400px;padding:8px 13px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);
}
.search:focus-within{border-color:rgba(124,92,255,.55);box-shadow:0 0 0 3px rgba(124,92,255,.14)}
.search input{flex:1;border:none;background:none;outline:none;font-size:13.5px}
.search input::placeholder{color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.currency-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:6px 11px;border-radius:99px;background:rgba(52,211,153,.12);
  border:1px solid rgba(52,211,153,.28);color:var(--good);
}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface-2);color:var(--muted);position:relative;
}
.icon-btn:hover{color:var(--text)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8.5px 15px;border-radius:11px;
  font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);transition:.16s;
}
.btn:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b8bff);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(124,92,255,.32)}
.btn .icon{width:16px;height:16px}

.content{padding:26px;max-width:1400px;width:100%;margin:0 auto}
.view{display:none}.view.is-active{display:block;animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:24px;letter-spacing:-.025em;font-weight:700}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}

.card{background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{font-size:14.5px;font-weight:650}
.link{font-size:12.5px;font-weight:600;color:var(--accent-2)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:15px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;padding-bottom:18px}
.stat-label{font-size:12px;color:var(--muted);font-weight:550}
.stat-value{font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:8px;line-height:1.15}
.stat-delta{font-size:11.5px;font-weight:600;margin-top:2px}
.stat-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}

.dash-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.mini-list{display:flex;flex-direction:column}
.mini-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 42px;gap:14px;align-items:center;padding:11px 10px;border-radius:11px}
.mini-row:hover{background:var(--surface-2)}
.mini-row + .mini-row{border-top:1px solid var(--border)}
.mini-name{font-size:13.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-client{font-size:11.5px;color:var(--muted)}
.mini-pct{font-size:12px;font-weight:700;text-align:right;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--text) 9%,transparent);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .9s}
.bar.good > i{background:linear-gradient(90deg,#10b981,#34d399)}
.bar.warn > i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.bad > i{background:linear-gradient(90deg,#ef4444,#f87171)}

.activity{list-style:none;margin:0;padding:0}
.activity li{display:flex;gap:11px;padding:10px 6px;border-radius:10px}
.activity li:hover{background:var(--surface-2)}
.act-icon{width:29px;height:29px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.act-body{font-size:12.8px;line-height:1.5}.act-body b{font-weight:650}
.act-time{display:block;font-size:11px;color:var(--muted);margin-top:1px}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6.5px 13px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.chip:hover{color:var(--text)}.chip.is-active{background:linear-gradient(135deg,rgba(124,92,255,.9),rgba(91,139,255,.9));border-color:transparent;color:#fff}

.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.project-card{display:flex;flex-direction:column;gap:13px;padding:17px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);border-radius:var(--radius);transition:.18s}
.project-card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow)}
.pc-client{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.pc-name{font-size:14.6px;font-weight:650;margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.pc-progress .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600}
.pc-budget{display:flex;justify-content:space-between;font-size:11.3px;color:var(--muted);font-weight:600;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border)}
.pc-budget b{color:var(--text)}
.pc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
.avatars{display:flex}
.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-8px}
.avatar:first-child{margin-left:0}
.avatar.xl{width:56px;height:56px;font-size:17px;border:none;margin:0}
.pc-due{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}

.pill{font-size:10.8px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.accent{background:rgba(124,92,255,.16);color:#a78bfa}
.pill.warn{background:rgba(251,191,36,.14);color:#fbbf24}
.pill.bad{background:rgba(248,113,113,.14);color:#f87171}
.pill.good{background:rgba(52,211,153,.14);color:#34d399}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

.table-wrap{overflow-x:auto;margin:0 -18px -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650;padding:0 16px 11px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.td-main{font-weight:650;font-size:13.5px}.td-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.td-val{font-weight:700;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:8px;justify-content:flex-end}
.action-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.action-btn:hover{color:var(--text);border-color:var(--border-strong)}
.action-btn.danger:hover{color:var(--bad);border-color:rgba(248,113,113,.4)}
.action-btn.good:hover{color:var(--good)}

.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.team-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 16px}
.team-card .name{font-weight:650;font-size:15px}.team-card .role{font-size:12px;color:var(--muted)}
.capacity{width:100%}.capacity .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px}

.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);outline:none}
.field input:focus,.field select:focus{border-color:rgba(124,92,255,.55)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}
.toggle-row .t{font-weight:600;font-size:13px}.toggle-row .s{font-size:11.5px;color:var(--muted)}
.switch{width:42px;height:24px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:.2s}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.switch[aria-checked="true"]{background:linear-gradient(135deg,var(--accent),#5b8bff)}
.switch[aria-checked="true"]::after{left:20px}

.modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-wrap.show{display:flex}
.modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.modal{
  position:relative;width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:22px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;
}
.modal h3{font-size:17px;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;font-weight:550;animation:fade .25s ease}
.loading-overlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loading-overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
.scrim.show{display:block}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;transform:translateX(-105%);transition:transform .25s;width:270px}
  .sidebar.is-open{transform:none}
  .menu-btn{display:grid}
  .dash-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="muted">Loading Forge Studio…</div>
</div>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="brand-name">Forge Studio</div>
        <div class="brand-sub">Client Portal</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" style="background:linear-gradient(135deg,#7c5cff,#22d3ee);margin:0;border:none;width:32px;height:32px;font-size:12px">AR</div>
        <div class="meta"><div class="name">Alex Rivera</div><div class="role">Studio Lead</div></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Search projects…  /" />
      </div>
      <div class="top-actions">
        <span class="currency-badge">Rs · PKR</span>
        <button class="icon-btn" id="themeBtn" title="Toggle theme">
          <svg class="icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn primary" data-action="new-project">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          New project
        </button>
      </div>
    </header>

    <div class="content">
      <div id="view-dashboard" class="view"></div>
      <div id="view-projects" class="view"></div>
      <div id="view-leads" class="view"></div>
      <div id="view-clients" class="view"></div>
      <div id="view-invoices" class="view"></div>
      <div id="view-team" class="view"></div>
      <div id="view-settings" class="view"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-wrap" id="modalWrap">
  <div class="modal-scrim" id="modalScrim" data-modal-close></div>
  <div class="modal">
    <h3 id="modalTitle">New item</h3>
    <form id="modalForm"></form>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   ICONS & HELPERS
   ============================================================ */
const ICONS = {
  home:'<path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  team:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  code:'<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',

function pill(status){

  else if(['blocked','overdue','warn'].includes(s)) cls='warn';
  else if(['lost','churned','bad','new'].includes(s) && s==='new') cls='accent';
  else if(['lost','churned'].includes(s)) cls='bad';
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}

}

function apiCall_(action, payload){
  if(hasGas() && google.script.run[action]){
    const args = payload === undefined ? [] :
      (payload && payload.record !== undefined) ? [payload.record] :
      (payload && payload.id !== undefined && payload.stage !== undefined) ? [payload.id, payload.stage] :
      (payload && payload.id !== undefined) ? [payload.id] : [payload];
    google.script.run
      .withSuccessHandler(afterSave)
      .withFailureHandler(err=>toast('Error: '+(err.message||err)))
      [action].apply(null, args);
    return;
  }
  // POST to Web App URL
  const body = Object.assign({ action: action }, payload || {});
  fetch(WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(r=>r.json())
    .then(d=>{
      if(d && d.error){ toast('Error: '+d.error); return; }
      afterSave(d);
    })
    .catch(err=>toast('Network error: '+err.message));
}

/* ============================================================
   TOTALS
   ============================================================ */
function computeTotals(){
  const outstanding=DATA.invoices.filter(i=>i.status!=='Paid').reduce((a,i)=>a+Number(i.amount||0),0);
  const overdue=DATA.invoices.filter(i=>i.status==='Overdue').reduce((a,i)=>a+Number(i.amount||0),0);
  const paid=DATA.invoices.filter(i=>i.status==='Paid').reduce((a,i)=>a+Number(i.amount||0),0);
  const openInvoices=DATA.invoices.filter(i=>i.status!=='Paid').length;
  const pipeline=DATA.leads.reduce((a,l)=>a+Number(l.value||0),0);
  return{outstanding,overdue,paid,openInvoices,pipeline};
}

              <td><div class="td-main">${esc(inv.client)}</div><div class="td-sub">${esc(inv.id)} · ${esc(inv.project)}</div></td>
              <td class="td-val">${money(inv.amount)}</td>
              <td class="muted">${esc(inv.issued)}</td>
              <td class="muted">${esc(inv.due)}</td>
              <td>${pill(inv.status)}</td>
              <td><div class="row-actions">
                <button class="action-btn" title="Download" data-toast="${esc(inv.id)} downloaded">${icon('download')}</button>
                <button class="action-btn" title="Remind" data-toast="Reminder sent">${icon('send')}</button>
              </div></td>
            </tr>`).join('')||'<tr><td colspan="6" class="muted" style="text-align:center;padding:30px">No invoices</td></tr>'}
        </tbody>
      </table></div>
    </section>`;
  $$('[data-ifilter]').forEach(b=>b.addEventListener('click',()=>{state.invoiceFilter=b.dataset.ifilter;renderInvoices()}));
}

function renderTeam(){
  const avg=DATA.team.length?Math.round(DATA.team.reduce((a,m)=>a+Number(m.capacity||0),0)/DATA.team.length):0;
  $('#view-team').innerHTML=`
    <div class="page-head">
      <div><h1>Team</h1><p>${DATA.team.length} people · avg capacity ${avg}%</p></div>
      <div class="head-actions"><button class="btn primary" data-toast="Invite link copied">${icon('plus')} Invite member</button></div>
    </div>
    <div class="team-grid">
      ${DATA.team.map((m,i)=>{
        const cls=m.capacity>85?'bad':m.capacity>65?'warn':'good';
        return `<article class="card team-card">
          ${avatar(m.initials,i,'xl')}
          <div><div class="name">${esc(m.name)}</div><div class="role">${esc(m.role)}</div></div>
          <div class="tags">${(m.skills||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
          <div class="capacity">
            <div class="lbl"><span>Capacity · ${m.projects} projects</span><span>${m.capacity}%</span></div>
            <div class="bar ${cls}"><i data-width="${m.capacity}" style="width:0"></i></div>
          </div>
        </article>`;
      }).join('')}
    </div>`;
}

function renderSettings(){
  $('#view-settings').innerHTML=`
    <div class="page-head">
      <div><h1>Settings</h1><p>Profile, notifications and workspace</p></div>
      <div class="head-actions"><button class="btn primary" data-toast="Settings saved">Save changes</button></div>
    </div>
    <div class="settings-grid">
      <section class="card">
        <div class="card-head"><h2>Profile</h2></div>
        <div class="field"><label>Full name</label><input value="Alex Rivera"></div>
        <div class="field"><label>Email</label><input type="email" value="alex@forgestudio.com"></div>
        <div class="field" style="margin:0"><label>Time zone</label>
          <select><option selected>UTC+05:00 · Pakistan Standard Time</option><option>UTC+00:00 · London</option></select>
        </div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Appearance</h2></div>
        <div class="toggle-row" style="border:none">
          <div><div class="t">Dark mode</div><div class="s">Switch theme</div></div>
          <button class="switch" id="themeSwitch" role="switch" aria-checked="${document.documentElement.dataset.theme==='dark'}"></button>
        </div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Workspace</h2></div>
        <div class="field"><label>Currency</label>
          <select><option selected>PKR — Pakistani Rupee (Rs)</option></select>
        </div>
        <div class="field" style="margin:0"><label>Portal URL</label><input value="portal.forgestudio.com"></div>
      </section>
    </div>`;
  const sw=$('#themeSwitch');
  if(sw) sw.addEventListener('click',()=>{
    const on=sw.getAttribute('aria-checked')==='true';
    sw.setAttribute('aria-checked',String(!on));
    toggleTheme();
  });
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(type, edit){
  state.modalType=type;state.modalEdit=edit||null;
  const form=$('#modalForm');
  let title='New item', fields='';
  if(type==='project'){
    title=edit?'Edit project':'New project';
    const p=edit||{};
    fields=`
      <div class="field"><label>Name</label><input name="name" required value="${esc(p.name||'')}"></div>
      <div class="field"><label>Client</label><input name="client" required value="${esc(p.client||'')}"></div>
      <div class="field"><label>Status</label>
        <select name="status">
          ${['In progress','In review','Blocked','Completed'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Progress %</label><input name="progress" type="number" min="0" max="100" value="${p.progress??0}"></div>
      <div class="field"><label>Due</label><input name="due" value="${esc(p.due||'')}"></div>
      <div class="field"><label>Budget (PKR)</label><input name="budget" type="number" value="${p.budget??0}"></div>
      <div class="field"><label>Spent (PKR)</label><input name="spent" type="number" value="${p.spent??0}"></div>
      <div class="field"><label>Team (comma initials)</label><input name="team" value="${esc((p.team||[]).join(','))}"></div>
      <div class="field"><label>Tags (comma)</label><input name="tags" value="${esc((p.tags||[]).join(','))}"></div>`;
  } else if(type==='client'){
    title=edit?'Edit client':'New client';
    const c=edit||{};
    fields=`
      <div class="field"><label>Company</label><input name="company" required value="${esc(c.company||'')}"></div>
      <div class="field"><label>Contact</label><input name="contact" value="${esc(c.contact||'')}"></div>
      <div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email||'')}"></div>
      <div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone||'')}"></div>
      <div class="field"><label>Industry</label><input name="industry" value="${esc(c.industry||'')}"></div>
      <div class="field"><label>Status</label>
        <select name="status">${['Active','Prospect','Churned'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>`;
  } else if(type==='lead'){
    title=edit?'Edit lead':'New lead';
    const l=edit||{};
    fields=`
      <div class="field"><label>Company</label><input name="company" required value="${esc(l.company||'')}"></div>
      <div class="field"><label>Contact</label><input name="contact" value="${esc(l.contact||'')}"></div>
      <div class="field"><label>Email</label><input name="email" type="email" value="${esc(l.email||'')}"></div>
      <div class="field"><label>Phone</label><input name="phone" value="${esc(l.phone||'')}"></div>
      <div class="field"><label>Value (PKR)</label><input name="value" type="number" value="${l.value??0}"></div>
      <div class="field"><label>Stage</label>
        <select name="stage">${['New','Contacted','Qualified','Proposal','Won','Lost'].map(s=>`<option ${l.stage===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Source</label><input name="source" value="${esc(l.source||'')}"></div>
      <div class="field"><label>Next step date</label><input name="next" value="${esc(l.next||'')}"></div>`;
  }
  $('#modalTitle').textContent=title;
  form.innerHTML=fields+`
    <div class="modal-actions">
      <button type="button" class="btn" data-modal-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>`;
  $('#modalWrap').classList.add('show');
}

function closeModal(){
  $('#modalWrap').classList.remove('show');
  state.modalType=null;state.modalEdit=null;
}

function handleModalSubmit(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const record=Object.fromEntries(fd.entries());
  if(state.modalEdit) record.id=state.modalEdit.id;

  // normalize numbers / lists for projects
  if(state.modalType==='project'){
    record.progress=Number(record.progress)||0;
    record.budget=Number(record.budget)||0;
    record.spent=Number(record.spent)||0;
  }
  if(state.modalType==='lead'){
    record.value=Number(record.value)||0;
  }

  if(state.modalType==='project') apiCall_('saveProject', { record });
  if(state.modalType==='client')  apiCall_('saveClient',  { record });
  if(state.modalType==='lead')    apiCall_('saveLead',    { record });
  closeModal();
}

/* ============================================================
   THEME & EVENTS
   ============================================================ */
function toggleTheme(){
  const root=document.documentElement;
  const next=root.dataset.theme==='dark'?'light':'dark';
  root.dataset.theme=next;
  $('#themeIcon').innerHTML=next==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="4"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}

function bindEvents(){
  $('#nav').addEventListener('click',e=>{
    const btn=e.target.closest('[data-view]');
    if(btn) showView(btn.dataset.view);
  });

  document.addEventListener('click',e=>{
    if(e.target.closest('[data-modal-close]')){closeModal();return}
    const goto=e.target.closest('[data-goto]');
    if(goto){showView(goto.dataset.goto);return}
    const t=e.target.closest('[data-toast]');
    if(t){toast(t.dataset.toast);return}
    const a=e.target.closest('[data-action]');
    if(a){
      const act=a.dataset.action;
      if(act==='new-project') openModal('project');
      if(act==='new-lead') openModal('lead');
      if(act==='new-client') openModal('client');
      return;
    }
    const ep=e.target.closest('[data-edit-project]');
    if(ep){const p=DATA.projects.find(x=>x.id===ep.dataset.editProject);if(p)openModal('project',p);return}
    const ec=e.target.closest('[data-edit-client]');
    if(ec){const c=DATA.clients.find(x=>x.id===ec.dataset.editClient);if(c)openModal('client',c);return}

    // Lead status
    const won=e.target.closest('[data-won-lead]');
    if(won){
      apiCall_('updateLeadStage', { id: won.dataset.wonLead, stage: 'Won' });
      return;
    }
    const lost=e.target.closest('[data-lost-lead]');
    if(lost){
      apiCall_('updateLeadStage', { id: lost.dataset.lostLead, stage: 'Lost' });
      return;
    }
    const dl=e.target.closest('[data-delete-lead]');
    if(dl){
      apiCall_('deleteLead', { id: dl.dataset.deleteLead });
      return;
    }
    const dc=e.target.closest('[data-delete-client]');
    if(dc){
      apiCall_('deleteClient', { id: dc.dataset.deleteClient });
      return;
    }
  });

  $('#modalForm').addEventListener('submit',handleModalSubmit);
  $('#menuBtn').addEventListener('click',()=>{$('#sidebar').classList.add('is-open');$('#scrim').classList.add('show')});
  $('#scrim').addEventListener('click',()=>{$('#sidebar').classList.remove('is-open');$('#scrim').classList.remove('show')});
  $('#themeBtn').addEventListener('click',toggleTheme);

  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus()}
    if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('is-open');$('#scrim').classList.remove('show')}
  });

  $('#globalSearch').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    state.projectQuery=e.target.value.trim();
    state.projectFilter='all';
    showView('projects');renderProjects();
    e.target.value='';
    toast('Searching projects…');
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  bindEvents();
  loadData(()=>{
    refreshAll();
    const initial=(location.hash||'').replace('#/','')||'dashboard';
    showView(initial);
    $('#loadingOverlay').classList.add('hidden');
  });
}
init();
</script>
